<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Орфозор</title>
  <style>body{font:18px/1.6 system-ui,sans-serif;background:#FBF8F2;color:#1E2333;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px;text-align:center}a{color:#2B44C0}</style>
</head>
<body>
  <main><h1>Такой страницы нет</h1><p>Через несколько секунд откроется главная страница Орфозора. <a id="home" href="/orfozor-ai/">Перейти сейчас</a></p></main>
  <script>
    // Сайт опубликован как проект GitHub Pages: корень — первый сегмент пути.
    var root = location.hostname.endsWith("github.io") ? "/" + location.pathname.split("/")[1] + "/" : "/";
    document.getElementById("home").href = root;
    setTimeout(function () { location.replace(root); }, 3000);
  </script>
</body>
</html>
